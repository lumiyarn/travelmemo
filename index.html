<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 일정 관리</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f5f5f5; }
        .box { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 12px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h3 { margin-top: 0; display: flex; align-items: center; gap: 8px; }
        
        details { border: 1px solid #eee; border-radius: 8px; margin-bottom: 10px; overflow: hidden; background: #fff; }
        summary { padding: 12px; background: #f9f9f9; cursor: pointer; font-weight: bold; list-style: none; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        summary::after { content: '▼'; font-size: 12px; color: #aaa; margin-left: auto; padding-left: 10px; }
        details[open] summary::after { content: '▲'; }
        
        .toggle-content { padding: 10px; min-height: 40px; background: #fafafa; border: 1px dashed #ddd; margin: 5px; border-radius: 6px; }

        .item { padding: 12px; background: #fff; border: 1px solid #eee; margin-bottom: 5px; border-radius: 6px; cursor: grab; display: flex; justify-content: space-between; align-items: center; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); user-select: none; }
        .item label { display: flex; align-items: center; gap: 8px; flex-grow: 1; cursor: pointer; margin: 0; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        
        .del-btn, .del-toggle-btn { display: none; background: #ffeded; color: #ff4444; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .show-delete .del-btn, .show-delete .del-toggle-btn { display: inline-block; }

        .input-group { display: flex; gap: 5px; margin-top: 15px; flex-wrap: wrap; border-top: 1px solid #eee; padding-top: 15px; }
        input[type="text"], input[type="date"], select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; flex-grow: 1; min-width: 100px; }
        .add-btn { background: #4A90E2; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .add-toggle-btn { background: #34A853; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

        .weather-scroll { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; }
        .weather-card { min-width: 80px; text-align: center; border: 1px solid #eee; border-radius: 10px; padding: 10px; background: #fff; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">✈️ 우리들의 여행 일지</h2>
    <p style="font-size:11px; color:#aaa; text-align:center;">계정: impd1203@gmail.com<br><span style="color:#ff4444; font-weight:bold;">※ 항목이나 토글을 '더블 클릭'하면 삭제 버튼이 나타납니다.</span></p>

    <div class="box">
        <h3>🛫 가는 편 비행기</h3>
        <div style="display: flex; gap: 5px;">
            <input type="date" id="date1">
            <input type="text" id="num1" placeholder="편명 (예: KE081)">
            <button type="button" class="add-btn" onclick="window.searchFlight(1)">조회</button>
        </div>
        <div id="result1" style="margin-top:10px;"></div>
    </div>

    <div class="box">
        <h3>🛬 오는 편 비행기</h3>
        <div style="display: flex; gap: 5px;">
            <input type="date" id="date2">
            <input type="text" id="num2" placeholder="편명 (예: OZ522)">
            <button type="button" class="add-btn" onclick="window.searchFlight(2)">조회</button>
        </div>
        <div id="result2" style="margin-top:10px;"></div>
    </div>

    <div class="box">
        <h3>🌤️ 현지 날씨 (예보)</h3>
        <div id="weatherResult" class="weather-scroll">비행기 조회가 필요합니다.</div>
    </div>

    <div class="box">
        <h3>🎒 준비물 리스트</h3>
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <input type="text" id="new-prepare-toggle" placeholder="새 카테고리 (예: 캠핑용품)">
            <button type="button" class="add-toggle-btn" onclick="window.addCategory('prepare')">토글 추가</button>
        </div>
        <div id="prepareToggles"></div>
        <div class="input-group">
            <select id="prepareCategorySelect"></select>
            <input type="text" id="input-prepare" placeholder="무엇을 챙길까요?">
            <button type="button" class="add-btn" onclick="window.addItem('prepare')">추가</button>
        </div>
    </div>

    <div class="box">
        <h3>📅 방문 일정</h3>
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <input type="text" id="new-schedule-toggle" placeholder="새 카테고리 (예: 1일차 맛집)">
            <button type="button" class="add-toggle-btn" onclick="window.addCategory('schedule')">토글 추가</button>
        </div>
        <div id="scheduleToggles"></div>
        <div class="input-group">
            <select id="scheduleCategorySelect"></select>
            <input type="text" id="input-schedule" placeholder="어디를 방문할까요?">
            <button type="button" class="add-btn" onclick="window.addItem('schedule')">추가</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVj_UmU-EJ58sUD056UAexa_k1soZwJDg",
            authDomain: "travelmemo-bd4f3.firebaseapp.com",
            projectId: "travelmemo-bd4f3",
            storageBucket: "travelmemo-bd4f3.firebasestorage.app",
            messagingSenderId: "84561942555",
            appId: "1:84561942555:web:cf38ed957c67633fffc0be",
            databaseURL: "https://travelmemo-bd4f3-default-rtdb.firebaseio.com"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const apiKey = "afb3990ec05a6fba1732ceca33cc8ca8";

        const getEmoji = (text) => {
            if(text.includes('필수')) return '🚨';
            if(text.includes('공항')) return '✈️';
            if(text.includes('전자') || text.includes('it')) return '💻';
            if(text.includes('돈') || text.includes('금전')) return '💳';
            if(text.includes('건강') || text.includes('약') || text.includes('헬스')) return '💊';
            if(text.includes('맛집')) return '🍱';
            if(text.includes('쇼핑')) return '🛍️';
            return '📌';
        };

        window.toggleDeleteBtn = function(element) {
            element.classList.toggle('show-delete');
        };

        const loadCategories = (type) => {
            const listRef = ref(db, `categories/${type}`);
            const orderRef = ref(db, `categoryOrder/${type}`);

            onValue(listRef, (snapshot) => {
                get(orderRef).then(orderSnap => {
                    let cats = snapshot.val();
                    let order = orderSnap.val() || [];
                    
                    if (!cats) {
                        if(type === 'prepare') { cats = { 'default1': '필수 준비물' }; order = ['default1']; }
                        if(type === 'schedule') { cats = { 'default1': '방문할 곳' }; order = ['default1']; }
                        set(listRef, cats);
                        set(orderRef, order);
                        return;
                    }

                    const container = document.getElementById(`${type}Toggles`);
                    const select = document.getElementById(`${type}CategorySelect`);
                    container.innerHTML = "";
                    select.innerHTML = "";

                    let keys = Object.keys(cats);
                    keys.sort((a, b) => {
                        let idxA = order.indexOf(a);
                        let idxB = order.indexOf(b);
                        return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
                    });

                    keys.forEach(id => {
                        const label = cats[id];
                        const emoji = getEmoji(label);
                        
                        const details = document.createElement('details');
                        details.open = true;
                        details.setAttribute('data-id', id);
                        details.innerHTML = `
                            <summary ondblclick="window.toggleDeleteBtn(this.parentElement)">
                                <span>${emoji} ${label}</span>
                                <button type="button" class="del-toggle-btn" onclick="window.removeCategory('${type}', '${id}', event)">삭제</button>
                            </summary>
                            <div class="toggle-content" id="list-${type}-${id}"></div>
                        `;
                        container.appendChild(details);

                        const opt = document.createElement('option');
                        opt.value = id;
                        opt.innerText = label;
                        select.appendChild(opt);

                        onValue(ref(db, `items/${type}/${id}`), s => {
                            const el = document.getElementById(`list-${type}-${id}`);
                            if(el) {
                                el.innerHTML = s.val() || "";
                                // Sortable 중복 초기화 방지 및 타 토글간 이동 시 DB 동기화 로직 추가
                                if(!el.dataset.sortable) {
                                    new Sortable(el, { 
                                        animation: 150, 
                                        group: type, // 같은 타입(준비물/일정)끼리 자유롭게 이동 가능
                                        onEnd: (evt) => {
                                            const fromId = evt.from.id.replace(`list-${type}-`, '');
                                            set(ref(db, `items/${type}/${fromId}`), evt.from.innerHTML); // 기존 토글 업데이트
                                            
                                            // 다른 토글로 이동했을 경우 도착지 토글도 업데이트
                                            if(evt.from !== evt.to) {
                                                const toId = evt.to.id.replace(`list-${type}-`, '');
                                                set(ref(db, `items/${type}/${toId}`), evt.to.innerHTML);
                                            }
                                        }
                                    });
                                    el.dataset.sortable = 'true';
                                }
                            }
                        });
                    });

                    // 토글 자체 드래그 이동
                    if(!container.dataset.sortable) {
                        new Sortable(container, {
                            animation: 150,
                            handle: 'summary',
                            onEnd: () => {
                                const newOrder = Array.from(container.children).map(child => child.getAttribute('data-id'));
                                set(orderRef, newOrder);
                            }
                        });
                        container.dataset.sortable = 'true';
                    }
                });
            });
        };

        window.addCategory = (type) => {
            const input = document.getElementById(`new-${type}-toggle`);
            if(!input.value) return;
            push(ref(db, `categories/${type}`), input.value);
            input.value = "";
        };

        window.removeCategory = (type, id, event) => {
            event.preventDefault();
            if(confirm("이 카테고리와 안의 모든 내용이 삭제됩니다. 계속할까요?")) {
                remove(ref(db, `categories/${type}/${id}`));
                remove(ref(db, `items/${type}/${id}`));
            }
        };

        window.addItem = (type) => {
            const catId = document.getElementById(`${type}CategorySelect`).value;
            const input = document.getElementById(`input-${type}`);
            if(!catId || !input.value) return;

            const listEl = document.getElementById(`list-${type}-${catId}`);
            const htmlString = `
                <div class="item" ondblclick="window.toggleDeleteBtn(this)">
                    <label><input type="checkbox" onchange="window.syncCheck(this, '${type}', '${catId}')"> <span>${input.value}</span></label>
                    <button type="button" class="del-btn" onclick="window.removeItem(this, '${type}', '${catId}')">삭제</button>
                </div>
            `;
            listEl.insertAdjacentHTML('beforeend', htmlString);
            set(ref(db, `items/${type}/${catId}`), listEl.innerHTML);
            input.value = "";
        };

        window.syncCheck = (cb, type, catId) => {
            if(cb.checked) cb.setAttribute('checked', 'checked');
            else cb.removeAttribute('checked');
            // 부모 토글 ID를 찾아 정확히 업데이트 (이동된 항목도 고려)
            const parentList = cb.closest('.toggle-content');
            const currentCatId = parentList.id.replace(`list-${type}-`, '');
            set(ref(db, `items/${type}/${currentCatId}`), parentList.innerHTML);
        };

        window.removeItem = (btn, type, catId) => {
            const parent = btn.closest('.toggle-content');
            const currentCatId = parent.id.replace(`list-${type}-`, '');
            btn.parentElement.remove();
            set(ref(db, `items/${type}/${currentCatId}`), parent.innerHTML);
        };

        loadCategories('prepare');
        loadCategories('schedule');

        onValue(ref(db, 'flight1'), s => document.getElementById('result1').innerHTML = s.val() || "");
        onValue(ref(db, 'flight2'), s => document.getElementById('result2').innerHTML = s.val() || "");
        onValue(ref(db, 'weatherHtml'), s => document.getElementById('weatherResult').innerHTML = s.val() || "비행기 조회가 필요합니다.");

        window.searchFlight = function(type) {
            const date = document.getElementById('date' + type).value;
            const num = document.getElementById('num' + type).value;
            if(!date || !num) return alert("날짜와 편명을 모두 입력하세요.");
            
            const url = encodeURIComponent(`http://api.aviationstack.com/v1/flights?access_key=${apiKey}&flight_iata=${num}`);
            document.getElementById('result' + type).innerHTML = "조회 중...";

            fetch(`https://api.allorigins.win/get?url=${url}`).then(res => res.json()).then(p => {
                const data = JSON.parse(p.contents);
                if(data.data && data.data.length > 0) {
                    const f = data.data[0];
                    const dep = f.departure, arr = f.arrival;
                    
                    const html = `<div style="padding:10px; border:1px solid #eee; border-radius:8px; margin-top:5px; font-size:14px; background: #fff;">
                        <strong>${f.airline.name} (${num})</strong><br>
                        ${dep.iata} (${dep.scheduled ? dep.scheduled.substring(11,16) : '-'}) ➔ ${arr.iata} (${arr.scheduled ? arr.scheduled.substring(11,16) : '-'})<br>
                        <small style="color:#666;">터미널: ${dep.terminal || '-'} / 게이트: ${dep.gate || '-'}</small><br>
                        <button type="button" class="del-btn" style="display:inline-block;" onclick="window.deleteFlight(${type})">기록 삭제</button>
                    </div>`;
                    set(ref(db, 'flight' + type), html);
                    
                    if(type === 1) updateWeather(date);
                } else {
                    document.getElementById('result' + type).innerHTML = "정보를 찾을 수 없습니다.";
                }
            }).catch(() => document.getElementById('result' + type).innerHTML = "조회 오류 (우회 서버 지연)");
        };

        window.deleteFlight = (type) => set(ref(db, 'flight' + type), "");

        async function updateWeather(date) {
            try {
                const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=34.69&longitude=135.50&daily=weathercode,temperature_2m_max&timezone=auto&start_date=${date}&end_date=${date}`);
                const wData = await wRes.json();
                let html = `<div class="weather-card"><div>${date.substring(5)}</div><div style="font-size:24px; margin:5px 0;">🌤️</div><strong style="font-size:16px;">${Math.round(wData.daily.temperature_2m_max[0])}°</strong></div>`;
                set(ref(db, 'weatherHtml'), html);
            } catch(e) { set(ref(db, 'weatherHtml'), "날씨 정보 없음"); }
        }
    </script>
</body>
</html>
